services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Srijan01@
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: dockerfile
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: task_manager
      DB_USER: postgres
      DB_PASSWORD: Srijan01@
      PORT: 5000
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data: